name: Fork Windows Build

# Fork (TerraRome/autoclip): build the Windows x64 installer of this fork on every push to
# fork/id-gaming, or on demand. Same PBS route as desktop-build.yml (portable Python + backend
# + static ffmpeg/ffprobe, NSIS installer) without the upstream release gates, telemetry
# secrets or updater signing. The installer is uploaded as the run's artifact.

on:
  workflow_dispatch:
  push:
    branches: [fork/id-gaming]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: fork-windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_INDEX_URL: https://pypi.org/simple

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Force LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache portable Python + ffmpeg downloads
        uses: actions/cache@v4
        with:
          path: |
            build/pbs-cache
            build/ffmpeg-cache
          key: desktop-downloads-windows-${{ hashFiles('scripts/build_windows_x64.sh', 'scripts/lib/desktop_build_common.sh', 'scripts/lib/ffmpeg_pin.sh', 'scripts/ffmpeg-win64.env') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0"

      - name: Build desktop app (PBS route)
        env:
          SENTRY_UPLOAD_SOURCEMAPS: 'false'
        run: bash scripts/build_windows_x64.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AutoClip-Terra-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
